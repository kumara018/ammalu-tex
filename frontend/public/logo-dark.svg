<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="512" height="512"
     role="img" aria-label="Ammalu Tex">
  <title>Ammalu Tex</title>
  <!-- A plain weave. Each thread BREAKS where another crosses over it, and the
       breaks alternate, so all nine crossings have one thread over and one
       under. Drawn whole and overlapped it is only a hash; the gaps are what
       make it cloth. Kept identical to components/Logo.tsx so no surface shows
       a redrawn approximation of the mark. -->
  <g stroke="#FAF6F3" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M15 20 H17.4 M22.6 20 H37.4 M42.6 20 H45"/>
    <path d="M15 30 H27.4 M32.6 30 H45"/>
    <path d="M15 40 H17.4 M22.6 40 H37.4 M42.6 40 H45"/>
    <path d="M20 15 V27.4 M20 32.6 V45"/>
    <path d="M30 15 V17.4 M30 22.6 V37.4 M30 42.6 V45"/>
    <path d="M40 15 V27.4 M40 32.6 V45"/>
  </g>
</svg>
